services:
  postgres:
    image: postgres:16-alpine
    container_name: mr-reklamacije-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mr
      POSTGRES_PASSWORD: mr_dev_password
      POSTGRES_DB: mr_reklamacije
    ports:
      - '5433:5432'
    volumes:
      - mr_postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mr -d mr_reklamacije']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mr-reklamacije-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      # Override DATABASE_URL — Docker DNS host is `postgres`, not localhost
      DATABASE_URL: postgresql://mr:mr_dev_password@postgres:5432/mr_reklamacije
    env_file:
      - apps/api/.env
    volumes:
      - ./apps/api/src:/app/apps/api/src
      # Required so `tsx --env-file=.env` inside `pnpm --filter api run dev` resolves a real file path
      - ./apps/api/.env:/app/apps/api/.env:ro
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
      # Preserve Linux pnpm installs: host `./packages` mount would overwrite
      # `packages/*/node_modules` with macOS store symlinks (wrong hashes in the container).
      - /app/packages/auth/node_modules
      - /app/packages/db/node_modules
      - /app/packages/excel/node_modules
      - /app/packages/i18n/node_modules
      - /app/packages/logger/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/ui/node_modules
    restart: unless-stopped

volumes:
  mr_postgres_data:
    name: mr_reklamacije_postgres_data
