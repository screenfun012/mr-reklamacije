name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # A hang guard, not a performance target: a healthy run with cold turbo caches passes 15 minutes
    # (2026-08-29 the polish pass was cancelled mid-integration at 15:17 with every test green).
    timeout-minutes: 25

    env:
      DATABASE_URL: postgresql://mr:mr_dev_password@localhost:5433/mr_reklamacije
      TEST_DATABASE_URL: postgresql://mr:mr_dev_password@localhost:5433/mr_reklamacije_test

    services:
      postgres:
        # Docker Library mirror — avoids Docker Hub anonymous pull rate limits on GHA runners
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: mr
          POSTGRES_PASSWORD: mr_dev_password
          POSTGRES_DB: mr_reklamacije
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency layer rules (api)
        run: pnpm --filter api depcruise

      - name: Install Postgres extensions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/db-init/01-extensions.sql

      - name: Ensure integration test database
        run: |
          psql postgresql://mr:mr_dev_password@localhost:5433/postgres -v ON_ERROR_STOP=1 -f scripts/db-init/02-test-database.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/db-init/01-extensions.sql

      - name: Database migrate
        run: pnpm --filter @mr/db db:migrate

      - name: Database seed
        run: pnpm --filter @mr/db db:seed

      - name: Test (unit)
        run: pnpm test

      # The intake work order and the claim report are PDFs drawn by a real headless Chromium, so
      # the integration suite launches one. Production already installs it the same way
      # (`apps/api/Dockerfile`); CI never did, which is why those tests had never actually run here
      # — the two earlier steps failed first and nothing reached them. Placed after the unit tests
      # so a lint or typecheck failure does not pay for the download.
      - name: Install Chromium for PDF rendering
        run: pnpm --filter api exec playwright install --with-deps chromium

      - name: Test (integration)
        run: pnpm test:integration
